# Public no-OEM Android 17 smoke for real, exact Classic PR source commits.
# No vault, signing, physical device, private artifact, paid runner, or license assent.
# Private signed candidate qualification stays in the separately owner-gated workflow.
name: Classic PUBLIC Android17 emulator cold boot (no OEM)
on:
  pull_request:
    branches: [main]
    paths:
      # Every production Classic source subtree, including future modules.
      - 'classic_source/**'
      # A CI/protected-emulator contract change must also retrigger QA.
      - '.github/workflows/classic-*.yml'
      # Protected candidate SHA gate source changes must qualify no-OEM runner too.
      - 'github_hosted/private_candidate_gate.py'
      - 'github_hosted/tests/test_private_candidate_gate.py'
      # Avoid expensive public emulator boots for documentation-only PRs.
      - '!classic_source/*.md'
      - '!classic_source/**/*.md'
permissions:
  contents: read
concurrency:
  group: classic-public-emulator-boot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  android17-no-oem-boot:
    if: ${{ github.repository == 'lxsdd/yeelight-loft-dj' && github.actor == 'lxsdd' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'lxsdd/yeelight-loft-dj' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact same-repository Classic candidate without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prove checked out commit equals PR head (not synthetic merge SHA)
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'CLASSIC_PUBLIC_QA_CANDIDATE_SHA=%s\n' "$EXPECTED_SHA"
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Cold boot exact API37 emulator without OEM, license assent, artifacts or devices
        run: bash classic_source/private_ci/run_public_android17_emulator_boot.sh --no-oem
