# A single protected-independent, public no-OEM emulator boot acceptance.
# Triggered only on changes to the original-stock emulator qualification path.
name: Classic PUBLIC Android17 emulator cold boot (no OEM)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/classic-public-emulator-boot.yml'
      - '.github/workflows/classic-private-stock-original-android17.yml'
      - 'classic_source/private_ci/run_stock_original_android17.sh'
      - 'classic_source/private_ci/run_public_android17_emulator_boot.sh'
      - 'classic_source/private_ci/emulator_boot_diagnosis.py'
      - 'classic_source/private_ci/select_android17_image.py'
      - 'classic_source/tests/test_public_android17_emulator_boot.py'
permissions:
  contents: read
concurrency:
  group: classic-public-emulator-boot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  android17-no-oem-boot:
    if: ${{ github.repository == 'lxsdd/yeelight-loft-dj' && github.actor == 'lxsdd' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout public source without retained credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Cold boot exact API37 emulator without OEM, license assent, artifacts or devices
        run: bash classic_source/private_ci/run_public_android17_emulator_boot.sh --no-oem
