name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      # Manually dispatched RC8 alone may access the legacy signing identity.
      # Pull-request CI never receives signing secrets or publishes APKs.
      - name: Validate user-dispatched RC8 and previous exact-source PR CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/rc8-safety-google-home-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Only the repository owner can manually authorize RC8 signing'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo '::error::Unexpected checkout SHA'; exit 1; }
          grep -Eq '^[[:space:]]*versionCode = 26$' app/build.gradle.kts || exit 1
          grep -Eq '^[[:space:]]*versionName = "0\.2\.8-rc8"$' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/58")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || { echo '::error::RC8 PR head moved'; exit 1; }
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'integration/rc8-safety-google-home-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'chat/color4-safety-single-session-failsafe-20261104' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::RC8 exact-source PR Android CI not successful'; exit 1; }
          echo "RC8 manual signing permitted for audited source $GITHUB_SHA"
      - name: Validate owner-dispatched Color4 RC9 and exact-source Android CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/color4-minimal-music-probe-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Only owner may sign RC9'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          grep -Fq 'versionCode = 27' app/build.gradle.kts || exit 1
          grep -Fq 'versionName = "0.2.8-rc9"' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/61")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'chat/color4-minimal-music-probe-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'integration/rc8-safety-google-home-20261105' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::RC9 exact-source PR CI not successful'; exit 1; }
          echo "Owner-signed RC9 test artifact permitted for $GITHUB_SHA"
      - name: Validate owner-dispatched RC10 microphone diagnostic and exact-source CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc10-mic-ab-adaptive-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Only owner may sign RC10'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          grep -Fq 'versionCode = 28' app/build.gradle.kts || exit 1
          grep -Fq 'versionName = "0.2.8-rc10"' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/62")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'chat/rc10-mic-ab-adaptive-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'chat/color4-minimal-music-probe-20261105' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::RC10 exact-source PR CI missing'; exit 1; }
          echo "RC10 owner-signed test artifact permitted for exact head $GITHUB_SHA"
      - name: Validate owner-dispatched RC11 tempo/spectrum and exact-source CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc11-music-visuals-tempo-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Owner authorization needed for RC11'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          grep -Fq 'versionCode = 29' app/build.gradle.kts || exit 1
          grep -Fq 'versionName = "0.2.8-rc11"' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/63")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'chat/rc11-music-visuals-tempo-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'chat/rc10-mic-ab-adaptive-20261105' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::Exact-source RC11 PR CI missing'; exit 1; }
          echo "RC11 owner-signed temporary test artifact permitted on SHA $GITHUB_SHA"
      - name: Validate owner-dispatched RC12 Live DJ and exact-source CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc12-live-dj-classic-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Only repo owner may sign RC12'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          grep -Fq 'versionCode = 30' app/build.gradle.kts || exit 1
          grep -Fq 'versionName = "0.2.8-rc12"' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/64")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'chat/rc12-live-dj-classic-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'chat/rc11-music-visuals-tempo-20261105' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::RC12 exact source CI is not green'; exit 1; }
          echo "RC12 owner-only signed temporary APK permitted for $GITHUB_SHA"
      - name: Validate owner-dispatched RC13 Live DJ and exact-source CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc13-standby-multicolor4-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Only repo owner may sign RC13'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          grep -Fq 'versionCode = 31' app/build.gradle.kts || exit 1
          grep -Fq 'versionName = "0.2.8-rc13"' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/65")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'chat/rc13-standby-multicolor4-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'chat/rc12-live-dj-classic-20261105' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::RC13 exact source CI is not green'; exit 1; }
          echo "RC13 owner-only signed temporary APK permitted for $GITHUB_SHA"
      - name: Validate owner-dispatched RC14 Live DJ and exact-source CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc14-adaptive-spectrum-notification-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Only repo owner may sign RC14'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          grep -Fq 'versionCode = 32' app/build.gradle.kts || exit 1
          grep -Fq 'versionName = "0.2.8-rc14"' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/66")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'chat/rc14-adaptive-spectrum-notification-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'chat/rc13-standby-multicolor4-20261105' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::RC14 exact source CI is not green'; exit 1; }
          echo "RC14 owner-only signed temporary APK permitted for $GITHUB_SHA"
      - name: Validate owner-dispatched RC15 Live DJ and exact-source CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc15-live-dj-reliability-controls-20261105' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "lxsdd" ]] || { echo '::error::Only repo owner may sign RC15'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          grep -Fq 'versionCode = 33' app/build.gradle.kts || exit 1
          grep -Fq 'versionName = "0.2.8-rc15"' app/build.gradle.kts || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/67")"
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(jq -r '.head.ref' <<< "$pr")" == 'chat/rc15-live-dj-reliability-controls-20261105' ]] || exit 1
          [[ "$(jq -r '.base.ref' <<< "$pr")" == 'chat/rc14-adaptive-spectrum-notification-20261105' ]] || exit 1
          [[ "$(jq -r '.state' <<< "$pr")" == 'open' && "$(jq -r '.draft' <<< "$pr")" == 'true' ]] || exit 1
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$GITHUB_SHA" -f per_page=100)"
          green="$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "pull_request" and .name == "Android CI")] | length' <<< "$runs")"
          [[ "$green" =~ ^[0-9]+$ && "$green" -ge 1 ]] || { echo '::error::RC15 exact source CI is not green'; exit 1; }
          echo "RC15 owner-only signed temporary APK permitted for $GITHUB_SHA"
      - name: Configure stable signing (trusted builds only)
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/rc8-safety-google-home-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/color4-minimal-music-probe-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc10-mic-ab-adaptive-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc11-music-visuals-tempo-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc12-live-dj-classic-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc13-standby-multicolor4-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc14-adaptive-spectrum-notification-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc15-live-dj-reliability-controls-20261105' && github.actor == 'lxsdd') }}
        env:
          STORE_B64: ${{ secrets.YEELIGHT_SIGNING_STORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YEELIGHT_SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$STORE_B64" || -z "$STORE_PASSWORD" ]]; then
            echo "::error::Missing stable signing secrets. Follow docs/SIGNING.md"
            exit 1
          fi
          echo "::add-mask::$STORE_PASSWORD"
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/loft-dj.p12"
          chmod 600 "$RUNNER_TEMP/loft-dj.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/loft-dj.p12" -alias loft-dj-app -storepass "$STORE_PASSWORD" >/dev/null
          echo "YEELIGHT_SIGNING_STORE=$RUNNER_TEMP/loft-dj.p12" >> "$GITHUB_ENV"
          echo "YEELIGHT_SIGNING_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Test certificate parsing across Android SDK versions
        shell: bash
        run: |
          set -euo pipefail
          digest="dc5fce6c385279a97e35f74d0b659a95ff960cc7d6be912cba3016bcfbb7dbca"
          for prefix in "Signer #1" "V2 Signer" "V3.0 Signer"; do
            output="$(printf '%s certificate SHA-256 digest: %s\n' "$prefix" "$digest" | bash .github/scripts/extract-apk-cert-sha256.sh)"
            test "$output" = "$digest"
          done
          invalid="$(printf 'Signer #1 public key SHA-256 digest: %s\n' "$digest" | bash .github/scripts/extract-apk-cert-sha256.sh)"
          test -z "$invalid"
      - name: Unit tests and debug build
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify permanent APK signing certificate
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/rc8-safety-google-home-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/color4-minimal-music-probe-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc10-mic-ab-adaptive-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc11-music-visuals-tempo-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc12-live-dj-classic-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc13-standby-multicolor4-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc14-adaptive-spectrum-notification-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc15-live-dj-reliability-controls-20261105' && github.actor == 'lxsdd') }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          signer="$(find "$sdk_dir/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$signer" ]]; then
            echo "::error::Android apksigner not found"
            exit 1
          fi
          "$signer" verify --verbose "$apk"
          observed="$("$signer" verify --print-certs "$apk" | bash .github/scripts/extract-apk-cert-sha256.sh)"
          expected="dc5fce6c385279a97e35f74d0b659a95ff960cc7d6be912cba3016bcfbb7dbca"
          if ! [[ "$observed" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not extract exactly one 64-character APK certificate digest"
            exit 1
          fi
          if [[ "$observed" != "$expected" ]]; then
            echo "::error::Unexpected APK signing certificate; artifact blocked"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ success() && ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/rc8-safety-google-home-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/color4-minimal-music-probe-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc10-mic-ab-adaptive-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc11-music-visuals-tempo-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc12-live-dj-classic-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc13-standby-multicolor4-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc14-adaptive-spectrum-notification-20261105' && github.actor == 'lxsdd') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chat/rc15-live-dj-reliability-controls-20261105' && github.actor == 'lxsdd')) }}
        with:
          name: yeelight-loft-dj-stable-signed
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  # A signed Actions artifact expires after 14 days and the ChatGPT Library
  # link is not a reliable APK distribution channel. Publish a durable,
  # versioned asset only from green trusted main OR owner-dispatched reviewed RC8.
  publish-signed-github-release:
    needs: verify-and-build
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/rc8-safety-google-home-20261105' && github.actor == 'lxsdd') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yeelight-loft-dj-stable-signed
          path: signed-apk
      - name: Publish immutable version-tagged APK asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          build_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts)"
          release_mode=()
          if [[ "$GITHUB_REF" == "refs/heads/integration/rc8-safety-google-home-20261105" ]]; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_ACTOR" == "lxsdd" ]] || exit 1
            [[ "$version" == "0.2.8-rc8" && "$build_code" == "26" ]] || { echo "::error::Wrong RC8 version"; exit 1; }
            release_mode=(--prerelease)
          else
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected stable version"; exit 1; }
            [[ "$build_code" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Unexpected versionCode"; exit 1; }
          fi
          shopt -s nullglob
          apks=(signed-apk/*.apk)
          [[ ${#apks[@]} -eq 1 ]] || { echo "::error::Expected exactly one signed APK"; exit 1; }
          asset="Yeelight-Loft-DJ-v${version}-build${build_code}-signed.apk"
          cp "${apks[0]}" "$asset"
          test -s "$asset"
          sha256sum "$asset" | tee apk.sha256
          tag="v${version}"
          # Never silently replace a public binary or move a published tag.
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists: immutable asset retained."
            exit 0
          fi
          gh release create "$tag" "$asset" apk.sha256 "${release_mode[@]}" \
            --target "$GITHUB_SHA" \
            --title "Yeelight Loft DJ ${version} (Build ${build_code})" \
            --notes "Prüfbar signierte Android-APK aus CI: ${GITHUB_SHA}. APK-Name: ${asset}. Installation nur bei passender bisheriger App-Signatur; Color4-Live-Musiktests bleiben deaktiviert. Keine Hardware-Abnahme durch CI."
          echo "Dauerhafter Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}"
