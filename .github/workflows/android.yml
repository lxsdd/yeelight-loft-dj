name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      # Pull-request builds are untrusted and never receive signing credentials.
      # Only main and explicit workflow_dispatch builds produce installable APKs.
      - name: Configure stable signing (trusted builds only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          STORE_B64: ${{ secrets.YEELIGHT_SIGNING_STORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YEELIGHT_SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$STORE_B64" || -z "$STORE_PASSWORD" ]]; then
            echo "::error::Missing stable signing secrets. Follow docs/SIGNING.md"
            exit 1
          fi
          echo "::add-mask::$STORE_PASSWORD"
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/loft-dj.p12"
          chmod 600 "$RUNNER_TEMP/loft-dj.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/loft-dj.p12" -alias loft-dj-app -storepass "$STORE_PASSWORD" >/dev/null
          echo "YEELIGHT_SIGNING_STORE=$RUNNER_TEMP/loft-dj.p12" >> "$GITHUB_ENV"
          echo "YEELIGHT_SIGNING_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Test certificate parsing across Android SDK versions
        shell: bash
        run: |
          set -euo pipefail
          digest="dc5fce6c385279a97e35f74d0b659a95ff960cc7d6be912cba3016bcfbb7dbca"
          for prefix in "Signer #1" "V2 Signer" "V3.0 Signer"; do
            output="$(printf '%s certificate SHA-256 digest: %s\n' "$prefix" "$digest" | bash .github/scripts/extract-apk-cert-sha256.sh)"
            test "$output" = "$digest"
          done
          invalid="$(printf 'Signer #1 public key SHA-256 digest: %s\n' "$digest" | bash .github/scripts/extract-apk-cert-sha256.sh)"
          test -z "$invalid"
      - name: Unit tests and debug build
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify permanent APK signing certificate
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          signer="$(find "$sdk_dir/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$signer" ]]; then
            echo "::error::Android apksigner not found"
            exit 1
          fi
          "$signer" verify --verbose "$apk"
          observed="$("$signer" verify --print-certs "$apk" | bash .github/scripts/extract-apk-cert-sha256.sh)"
          expected="dc5fce6c385279a97e35f74d0b659a95ff960cc7d6be912cba3016bcfbb7dbca"
          if ! [[ "$observed" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not extract exactly one 64-character APK certificate digest"
            exit 1
          fi
          if [[ "$observed" != "$expected" ]]; then
            echo "::error::Unexpected APK signing certificate; artifact blocked"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        with:
          name: yeelight-loft-dj-stable-signed
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  # A signed Actions artifact expires after 14 days and the ChatGPT Library
  # link is not a reliable APK distribution channel. Publish a durable,
  # versioned asset only from a green, trusted main-branch build.
  publish-signed-github-release:
    needs: verify-and-build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yeelight-loft-dj-stable-signed
          path: signed-apk
      - name: Publish immutable version-tagged APK asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          build_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected versionName"; exit 1; }
          [[ "$build_code" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Unexpected versionCode"; exit 1; }
          shopt -s nullglob
          apks=(signed-apk/*.apk)
          [[ ${#apks[@]} -eq 1 ]] || { echo "::error::Expected exactly one signed APK"; exit 1; }
          asset="Yeelight-Loft-DJ-v${version}-build${build_code}-signed.apk"
          cp "${apks[0]}" "$asset"
          test -s "$asset"
          sha256sum "$asset"
          tag="v${version}"
          # Never silently replace a public binary or move a published tag.
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists: immutable asset retained."
            exit 0
          fi
          gh release create "$tag" "$asset" \
            --target "$GITHUB_SHA" \
            --title "Yeelight Loft DJ ${version} (Build ${build_code})" \
            --notes "Regulär signierte Android-APK aus dem erfolgreich getesteten und per Zertifikat verifizierten main-Build. APK-Name: ${asset}. Installierbares In-Place-Update bei übereinstimmender Signatur. Hardwaretest der Lampen bleibt gesondert erforderlich."
          echo "Dauerhafter Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}"
